apiVersion: v1
kind: Service
metadata:
  name: hello-app
  labels:
    app: hello-app
    app.kubernetes.io/name: hello-app
    app.kubernetes.io/managed-by: github-actions
spec:
  type: ClusterIP
  selector:
    app: hello-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP